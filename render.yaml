# Blueprint para Render (https://render.com) — "New + → Blueprint" apuntando a este repo.
services:
  - type: web
    name: toolify
    runtime: docker
    plan: free            # 512 MB RAM, se duerme tras 15 min inactivo
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: AUTH_USER     # define un usuario en el panel de Render
        sync: false
      - key: AUTH_PASS     # define una contraseña en el panel de Render
        sync: false
